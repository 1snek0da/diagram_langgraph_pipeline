[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diagram-langgraph-pipeline"
version = "0.1.0"
description = "A diagram-driven LangGraph pipeline for stock research."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.13,<5",
    "httpx>=0.28,<1",
    "langgraph>=1.2,<2",
    "pydantic>=2.12,<3",
    "pypdf>=6,<7",
    "python-docx>=1.2,<2",
    "typing-extensions>=4.12,<5",
    "yfinance>=0.2.50,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]
sources = [
    "tushare>=1.4,<2",
]

[project.scripts]
diagram-langgraph-pipeline = "diagram_langgraph_pipeline.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
